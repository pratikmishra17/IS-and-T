<header class="glass-panel mx-auto grid max-w-6xl grid-cols-[1fr_auto] items-center gap-y-4 rounded-3xl px-4 py-3 sm:grid-cols-[1fr_auto_1fr] sm:px-6">
  <a routerLink="/home" class="glass-link flex w-fit items-center gap-2.5" aria-label="IS and T home">
    <span class="brand-mark flex size-9 items-center justify-center rounded-xl" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </span>
    <span class="font-semibold tracking-wide">IS &amp; T</span>
  </a>

  @if (auth.isLoggedIn()) {
    <nav aria-label="Main navigation" class="brand-mark col-span-2 row-start-2 hidden justify-center gap-1 rounded-2xl p-1 sm:col-span-1 sm:col-start-2 sm:row-start-1 sm:flex">
      @for (section of sections; track section) {
        <a [routerLink]="'/' + section" routerLinkActive="nav-item-active" ariaCurrentWhenActive="page" class="glass-link rounded-xl px-4 capitalize">{{ section }}</a>
      }
    </nav>
  }

  <div class="col-start-2 row-start-1 flex items-center gap-2 justify-self-end sm:col-start-3">
    <app-theme-toggle />
    @if (auth.isLoggedIn()) {
      <app-account-menu />
    }
  </div>
</header>

@if (auth.isLoggedIn()) {
  <!-- Phones only: a tab bar fixed to the bottom of the screen -->
  <nav aria-label="Main navigation" class="fixed inset-x-3 bottom-3 z-40 sm:hidden">
    @if (moreOpen()) {
      <div id="more-menu" class="glass-menu absolute bottom-full right-0 mb-2 w-56 rounded-2xl p-2">
        <a routerLink="/account" class="glass-link block" (click)="moreOpen.set(false)">My account</a>
        <a routerLink="/inventory" class="glass-link block" (click)="moreOpen.set(false)">Inventory</a>
        <div class="my-1 border-t border-slate-200/70"></div>
        <button type="button" class="glass-link block w-full text-left text-rose-800" (click)="logout()">Log out</button>
      </div>
    }
    <div class="glass-panel grid grid-cols-4 rounded-3xl px-1 py-1.5">
      @for (tab of mobileTabs; track tab.path) {
        <a [routerLink]="tab.path" routerLinkActive="nav-item-active" ariaCurrentWhenActive="page" class="glass-hover flex flex-col items-center gap-0.5 rounded-2xl py-1.5 text-[0.7rem] font-medium text-slate-600" (click)="moreOpen.set(false)">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="tab.icon" /></svg>
          {{ tab.label }}
        </a>
      }
      <button type="button" class="glass-hover flex cursor-pointer flex-col items-center gap-0.5 rounded-2xl py-1.5 text-[0.7rem] font-medium text-slate-600" aria-controls="more-menu" [attr.aria-expanded]="moreOpen()" (click)="moreOpen.set(!moreOpen())">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path [attr.d]="moreIcon" /></svg>
        More
      </button>
    </div>
  </nav>
}

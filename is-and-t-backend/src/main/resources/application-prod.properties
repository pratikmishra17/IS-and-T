# Production: start the app with SPRING_PROFILES_ACTIVE=prod. ProductionSafetyCheck refuses to start
# if anything below (or the environment it needs) is unsafe.

# The public https:// address of the app, used in email links and calendar feeds
app.frontend-url=${FRONTEND_URL}

# Cookies only over HTTPS
app.security.secure-cookies=true

# Behind a reverse proxy / load balancer: trust its X-Forwarded-* headers, so the app sees the real
# client address (for login limits) and knows requests arrived over HTTPS
server.forward-headers-strategy=framework

# Quiet logs, nothing extra in errors
spring.jpa.show-sql=false

# DevTools is left out of packaged builds already; this makes sure restarts can't be triggered either
spring.devtools.restart.enabled=false

# Only loaded when the "dev" profile is active (the default on developer machines).

# The dev admin account, created on first startup if it doesn't exist yet (see DevDataSeeder).
# Its password is never written here: set DEV_ADMIN_PASSWORD to start with one (it must be changed
# at first login), or leave it unset and a set-password link is emailed to the address instead.
# Each developer can make it their own with DEV_ADMIN_EMAIL, DEV_ADMIN_FIRST_NAME and DEV_ADMIN_LAST_NAME.
app.seed.admin-email=${DEV_ADMIN_EMAIL:gomesalister98@gmail.com}
app.seed.admin-password=${DEV_ADMIN_PASSWORD:}
app.seed.admin-first-name=${DEV_ADMIN_FIRST_NAME:Alister}
app.seed.admin-last-name=${DEV_ADMIN_LAST_NAME:Gomes}

# Print SQL in the console while developing
spring.jpa.show-sql=true

# DevTools restarts the app (inside Eclipse, keeping its environment variables) only when this
# file changes, not on every saved file, so a half-finished change never triggers a restart.
# The file is local to each machine (.gitignore); touch it to restart.
spring.devtools.restart.trigger-file=.reloadtrigger
spring.devtools.livereload.enabled=false
# DevTools normally saves login sessions to disk and restores them after a restart; don't, so a
# restart signs everyone out, as it would in production.
server.servlet.session.persistent=false

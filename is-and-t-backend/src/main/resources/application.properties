spring.application.name=is-and-t-backend

# Use the "dev" profile (application-dev.properties) unless another profile is chosen
spring.profiles.default=dev

# Where the Angular app runs; used to build links in emails
app.frontend-url=http://localhost:4200

# Campus time zone (Cleveland): what "today" means for semesters, holidays, shifts and tasks
app.time-zone=America/New_York

# Database: each developer can override these with environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/isandt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway creates and changes tables (src/main/resources/db/migration);
# Hibernate only checks that the entities match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Outgoing email, sent through Gmail. Every email comes from app.mail.from, whichever admin
# triggered it. GMAIL_APP_PASSWORD is a Gmail "App Password" set as an environment variable
# (never in this file). Without it, emails are printed to the console instead (see EmailConfig).
app.mail.from=gomesalister98@gmail.com
app.mail.from-name=IS&T Portal
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${app.mail.from}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

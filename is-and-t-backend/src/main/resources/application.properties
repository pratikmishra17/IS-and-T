spring.application.name=is-and-t-backend

# Use the "dev" profile (application-dev.properties) unless another profile is chosen
spring.profiles.default=dev

# Where the Angular app runs; used to build links in emails
app.frontend-url=http://localhost:4200

# Campus time zone (Cleveland): what "today" means for semesters, holidays, shifts and tasks
app.time-zone=America/New_York

# Database: each developer can override these with environment variables.
# Two users (see docs/db-roles.sql): migrations run as the owner of the tables, the app itself as a
# user that can only read and write rows. Until DB_MIGRATION_* are set, migrations use the app's user.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/isandt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.user=${DB_MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${spring.datasource.password}}

# Flyway creates and changes tables (src/main/resources/db/migration);
# Hibernate only checks that the entities match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Login sessions: signed out after this long without activity (admins sooner), and after
# app.session.max-hours whatever happens (enforced by SessionGuardFilter).
app.session.admin-idle-minutes=15
app.session.student-idle-minutes=30
app.session.max-hours=12
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Cookies marked Secure (sent over HTTPS only). Off on developer machines, which use plain HTTP;
# the prod profile turns it on.
app.security.secure-cookies=false
server.servlet.session.cookie.secure=${app.security.secure-cookies}

# Never send stack traces or internal messages to the browser
server.error.include-stacktrace=never
server.error.include-message=never

# Outgoing email, sent through Gmail. Every email comes from app.mail.from, whichever admin
# triggered it. GMAIL_APP_PASSWORD is a Gmail "App Password" set as an environment variable
# (never in this file). Without it, emails are printed to the console instead (see EmailConfig).
# MAIL_FROM changes the sending Gmail account (the app password must belong to that account).
app.mail.from=${MAIL_FROM:gomesalister98@gmail.com}
app.mail.from-name=IS&T Portal
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${app.mail.from}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
